version: 1
# DNS rules for the six labels in the current Flow dataset.
# Rules are intentionally conservative: only service-specific domains are listed.
# Do NOT add generic providers (googleapis.com, google.com, cloudflare.com, etc.).
# `other-web` is a model label, not a catch-all DNS rule.
applications:
  - application_id: chatgpt
    domains:
      - rule_id: chatgpt-chatgpt-com
        domain: chatgpt.com
        match: suffix
      - rule_id: chatgpt-chat-openai-com
        domain: chat.openai.com
        match: suffix

  - application_id: facebook
    domains:
      - rule_id: facebook-facebook-com
        domain: facebook.com
        match: suffix
      - rule_id: facebook-facebook-net
        domain: facebook.net
        match: suffix
      - rule_id: facebook-fbcdn-net
        domain: fbcdn.net
        match: suffix
      - rule_id: facebook-fbsbx-com
        domain: fbsbx.com
        match: suffix
      - rule_id: facebook-fb-com
        domain: fb.com
        match: suffix
      - rule_id: facebook-fb-me
        domain: fb.me
        match: suffix

